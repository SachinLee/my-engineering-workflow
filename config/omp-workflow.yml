# Load this file explicitly with `omp --config <path>`.
# Context mode: pointer at session start; task artifacts are loaded by dispatch.
# Default route is lightweight/standard inline; escalate to critical explicitly.
# Named-task resolver is optional; explicit task paths are the compatibility fallback.
skills:
  includeSkills:
    - run-engineering-workflow
    - clarify-requirements
    - plan-solution
    - review-implementation
    - finish-with-evidence
    - trellis-*
    - intent-driven-development
    - tdd-workflow
    - verification-loop
    - security-review
    - coding-standards
    - e2e-testing
    - grilling
    - domain-modeling
    - codebase-design
    - code-review
    - ponytail-review
    - ponytail-audit
    - "*-tdd"
    - "*-verification"
    - "*-security"
    - "*-code-review"

task:
  # Keep ordinary OMP work bounded; critical tasks may opt into a larger budget.
  maxConcurrency: 2
  maxRuntimeMs: 900000
  agentIdleTtlMs: 600000
  maxRecursionDepth: 1
  softRequestBudget: 80
  agentModelOverrides:
    workflow-planner: "@plan"
    trellis-implement: "@task"
    trellis-check: "@advisor"
    workflow-reviewer: "@advisor"
  agentPrewalk:
    trellis-implement: false

plan:
  defaultOnStartup: false

prewalk:
  enabled: false
