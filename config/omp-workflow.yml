# Load this file explicitly with `omp --config <path>`.
# Context mode: pointer read at session start; task artifacts are loaded by dispatch.
# Default route is lightweight/standard inline; escalate to critical explicitly.
# Never add a per-turn context injector here; head-of-input state destroys the prompt cache.
skills:
  includeSkills:
    - run-engineering-workflow
    - clarify-requirements
    - plan-solution
    - review-implementation
    - finish-with-evidence
    - grill-with-docs
    - grilling
    - domain-modeling
    - codebase-design
    - diagnosing-bugs
    - tdd
    - code-review
    - ponytail-review

task:
  # Keep ordinary OMP work bounded; critical tasks may opt into a larger budget.
  maxConcurrency: 2
  maxRuntimeMs: 900000
  agentIdleTtlMs: 600000
  maxRecursionDepth: 1
  softRequestBudget: 80
  agentModelOverrides:
    workflow-planner: "@plan"
    workflow-implementer: "@task"
    workflow-reviewer: "@advisor"
  agentPrewalk:
    workflow-implementer: "off"

plan:
  defaultOnStartup: false

prewalk:
  enabled: false
